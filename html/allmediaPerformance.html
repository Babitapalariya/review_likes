<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <title>Review Likes — Media Details</title>
      <link rel="icon" type="image/x-icon" href="assets/images/favicon.png" />
      <script src="assets/js/popper.min.js" type="text/javascript"></script>
      <script src="assets/js/bootstrap.min.js" type="text/javascript"></script>
      <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css"/>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Arima:wght@100..700&family=Arimo:ital,wght@0,400..700;1,400..700&family=Kaushan+Script&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
      <link rel="stylesheet" type="text/css" href="assets/css/common.css"/>
      <!-- FIXED PATH (removed leading /) -->
      <link rel="stylesheet" href="assets/css/allmediaPerformance.css" />
   </head>
   <body>
      <!-- Menu start here-->
      <header>
         <nav class="navbar navbar-expand-lg main-navbar">
            <div class="container-fluid">
               <a class="navbar-brand logo" href="#">ReviewLikes</a>
               <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuitems" aria-controls="menuitems" aria-expanded="false" aria-label="Toggle navigation">
               <span class="navbar-toggler-icon"></span>
               </button>
               <div class="collapse navbar-collapse" id="menuitems">
                  <ul class="navbar-nav m-auto mb-2 mb-lg-0">
                     <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                     <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Merchant</a></li>
                     <li class="nav-item"><a class="nav-link" href="#">Freelance</a></li>
                     <li class="nav-item"><a class="nav-link" href="#">Market Place</a></li>
                     <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Settings</a>
                        <ul class="dropdown-menu">
                           <li><a class="dropdown-item" href="#">Account Settings</a></li>
                           <li><a class="dropdown-item" href="#">Logout</a></li>
                        </ul>
                     </li>
                  </ul>
                  <div class="d-flex">
                     <select class="form-select">
                        <option value="India">India</option>
                        <option value="US" selected>US</option>
                        <option value="UK">UK</option>
                     </select>
                     <select class="form-select">
                        <option selected>English</option>
                        <option value="Spanish">Spanish</option>
                     </select>
                     <button type="button" class="btn btn-default">Sign in</button>
                  </div>
               </div>
            </div>
         </nav>
      </header>
      <!-- Menu end here-->
      <div class="container py-4 allmediaDetails">
         <!-- Back Button -->
         <div class="mb-3">
            <a href="merchantdashboard.html#all-videos" class="btn btn-secondary">
            Back to Menu
            </a>
         </div>
         <h2 class="text-center">All Media Performance</h2>
         <!-- Date Range -->
         <div class="row mt-5 mb-3 daterange-section">
            <div class="col-md-12">
               <div class="row mb-4 align-items-center">
                  <!-- From Date -->
                  <div class="col-md-3">
                     <label for="dateRangeFrom" class="form-label me-2">From</label>
                     <input type="date" class="form-control d-inline-block w-auto" id="dateRangeFrom" name="fromDate">
                  </div>
                  <!-- To Date -->
                  <div class="col-md-3">
                     <label for="dateRangeTo" class="form-label me-2">To</label>
                     <input type="date" class="form-control d-inline-block w-auto" id="dateRangeTo" name="toDate">
                  </div>
                  <!--All Time-->
                  <div class="col-md-2">
                     <div class="form-check d-flex align-items-center">
                        <input type="checkbox" class="form-check-input me-2" id="rebuttalselectAll">
                        <label class="form-check-label mb-0" for="rebuttalselectAll">All Time</label>
                     </div>
                  </div>
               </div>
            </div>
         </div>
         <!-- Video Performance Table -->
         <table class="table table-bordered text-center">
            <thead>
               <tr>
                  <th>Video Link</th>
                  <th>Likes</th>
                  <th>Shares</th>
                  <th>Comments</th>
                  <th>Views</th>
                  <th>View Product</th>
               </tr>
            </thead>
            <tbody>
               <tr>
                  <td><span class="btn-link" data-bs-toggle="modal" data-bs-target="#videoModal"
                     onclick="loadVideo('https://www.youtube.com/embed/UWFoxol1yV0?autoplay=1')">
                     Video Link 1
                     </span>
                  </td>
                  <td>4</td>
                  <td>6</td>
                  <td>9</td>
                  <td>12</td>
                  <td><a href="productDescription.html" class="btn btn-sm btn-primary">View Product</a></td>
               </tr>
               <tr>
                  <td><span class="btn-link" data-bs-toggle="modal" data-bs-target="#videoModal"
                     onclick="loadVideo('https://www.youtube.com/embed/UWFoxol1yV0?autoplay=1')">
                     Video Link 2
                     </span>
                  </td>
                  <td>6</td>
                  <td>9</td>
                  <td>12</td>
                  <td>16</td>
                  <td><a href="productDescription.html" class="btn btn-sm btn-primary">View Product</a></td>
               </tr>
            </tbody>
         </table>
         <!-- Video Preview Modal -->
         <div class="modal fade" id="videoModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
               <div class="modal-content">
                  <div class="modal-header">
                     <h5 class="modal-title">Video Preview</h5>
                     <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                  </div>
                  <div class="modal-body text-center">
                     <iframe id="videoFrame" width="100%" height="400" frameborder="0"
                        allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen></iframe>
                  </div>
               </div>
            </div>
         </div>
      </div>
      <!-- jQuery -->
      <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
      <script src="assets/js/common.js"></script>
      <script src="assets/js/custom.js"></script>
   </body>
</html>
