   This is the html for sign in page-->
   <!DOCTYPE html>
   <html>
      <head>
         <!-- All the meta info start here-->
         <meta charset="UTF-8" />
         <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
            />
         <title>Sign In</title>
         <link rel="icon" type="image/x-icon" href="assets/images/favicon.png" />
         <script src="assets/js/popper.min.js" type="text/javascript"></script>
         <script src="assets/js/bootstrap.min.js" type="text/javascript"></script>
         <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css"/>
         <link rel="preconnect" href="https://fonts.googleapis.com">
         <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
         <link href="https://fonts.googleapis.com/css2?family=Arima:wght@100..700&family=Arimo:ital,wght@0,400..700;1,400..700&family=Kaushan+Script&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
         <link rel="stylesheet" type="text/css" href="assets/css/login.css" />
         <!-- All the meta info end here-->
      </head>
      <body>
         <div class="container-fluid">
            <div class="row">
               <div class="col-sm-6 leftsection">
                  <span class="logo">ReviewLikes</span>
                  <div class="image-section text-center">
                     <img src="./assets/images/login/login.svg" alt="login image" class="w-50">
                  </div>
               </div>
               <div class="col-sm-6 rightsection">
                  <div class="formsection">
                     <form>
                        <h2 class="text-center mb-5">Sign In</h2>
                        <input type="email" id="inputEmail" class="form-control mb-4" placeholder="Email address" required>
                        <input type="password" id="password" class="form-control mb-4" placeholder="Password" required>
                        <button type="button" class="btn btn-default mt-3">Login</button>
                     </form>
                     <div class="signuplink">Or Sign Up Using</div>
                     <a href="#" class="signup">Sign Up</a>
                  </div>
               </div>
            </div>
         </div>
         <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
      </body>
   </html>
