   This is the html for Sign Up page-->
   <!DOCTYPE html>
   <html>
      <head>
         <!-- All the meta info start here-->
         <meta charset="UTF-8" />
         <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
            />
         <title>Sign Up</title>
         <link rel="icon" type="image/x-icon" href="assets/images/favicon.png" />
         <script src="assets/js/popper.min.js" type="text/javascript"></script>
         <script src="assets/js/bootstrap.min.js" type="text/javascript"></script>
         <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css"/>
         <link rel="preconnect" href="https://fonts.googleapis.com">
         <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
         <link href="https://fonts.googleapis.com/css2?family=Arima:wght@100..700&family=Arimo:ital,wght@0,400..700;1,400..700&family=Kaushan+Script&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
         <link rel="stylesheet" type="text/css" href="assets/css/signup.css" />
         <!-- All the meta info end here-->
      </head>
      <body>
         <div class="container-fluid">
            <div class="row">
               <div class="col-sm-7 contentsection">
                  <form action="">
                     <h2 class="text-center mb-5">Sign Up</h2>
                     <div class="row">
                        <div class="col-md-6">
                           <input type="text" id="fname" class="form-control mb-3" placeholder="First Name" required>
                        </div>
                        <div class="col-md-6">
                           <input type="text" id="lname" class="form-control mb-3" placeholder="Last Name" required>
                        </div>
                        <div class="col-md-6">
                           <input type="email" id="email" class="form-control mb-3" placeholder="Email Address" required>
                        </div>
                        <div class="col-md-6">
                           <input type="text" id="phonenumber" class="form-control mb-3" placeholder="Phone Number" required>
                        </div>
                        <div class="col-md-12">
                           <select class="form-select mb-3" required>
                              <option selected>Select Role</option>
                              <option value="Merchant">Merchant</option>
                              <option value="User">User</option>
                              <option value="Freelancer">Freelancer</option>
                              <option value="GameShaker">Game Shaker</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                           <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>
                        </div>
                        <div class="col-md-12">
                           <input type="password" id="confirmpassword" class="form-control mb-3" placeholder="Confirm Password" required>
                        </div>
                        <div class="col-md-12 text-center mt-2">
                           <button type="button" class="btn btn-default mt-3">Sign Up</button>
                        </div>
                        <div class="termspolicy">I accept the <a href="#">Terms of Use & Privacy Policy</a></div>
                        <div class="signin mt-3">Already have an account? <a href="#">Login here.</a></div>
                     </div>
                  </form>
               </div>
               <div class="col-sm-5 logosection">
                  <span class="logo">ReviewLikes</span>
                  <div class="image-section text-center">
                     <img src="./assets/images/signup/signup.svg" alt="sign up image" class="w-50">
                  </div>
               </div>
            </div>
         </div>
      <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
      <script type="text/javascript" src="assets/js/common.js"></script>
      </body>
   </html>
