role_based_registration.profile_completion:
  path: '/user/{user}/complete-profile'
  defaults:
    _title: 'Complete Your Profile'
    _form: '\Drupal\role_based_registration\Form\ProfileCompletionForm'
  requirements:
    _custom_access: '\Drupal\role_based_registration\Form\ProfileCompletionForm::access'
  options:
    _admin_route: FALSE

role_based_registration.business_form:
  path: 'merchant/business-registration'
  defaults:
    _title: 'Business Registration'
    _form: '\Drupal\role_based_registration\Form\BusinessRegistrationForm'
  requirements:
    _custom_access: '\Drupal\role_based_registration\Form\BusinessRegistrationForm::access'

role_based_registration.user_list:
  path: '/marchant-dashboard'
  defaults:
    _controller: '\Drupal\role_based_registration\Controller\UserListController::userListPage'
    _title: 'User List'
  requirements:
    _permission: 'access content'

